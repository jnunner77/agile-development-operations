# Production stack: the app plus Caddy, which obtains and renews HTTPS certificates
# automatically. Configure it with a .env file next to this one (see deploy/.env.example).

# Rotate container logs so they can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      TRUST_PROXY: "1"
      SEED: ${SEED:-demo}
      SECURITY_ALLOWLIST: ${SECURITY_ALLOWLIST:-}
    volumes:
      - boards-data:/data
    expose:
      - "4000"
    # Hardening: read-only filesystem apart from /data and a small /tmp, no Linux
    # capabilities, no privilege escalation, and caps on memory and processes.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 512m
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env (for example yourteam.duckdns.org)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 256m
    logging: *logging

volumes:
  boards-data:
  caddy-data:
  caddy-config:
